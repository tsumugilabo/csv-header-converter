<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSVヘッダー変換ツール</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1f2933; --sub:#607080; --line:#d5dbe3; --card:#fff; --accent:#2b6cb0; --ok:#2f855a; --warn:#b7791f; --err:#c53030; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181d; --fg:#e4e9ee; --sub:#93a1b0; --line:#2c353f; --card:#1c2229; --accent:#63a4e8; --ok:#5fc48c; --warn:#e0b25c; --err:#f08080; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 system-ui,"Yu Gothic UI","Meiryo",sans-serif; }
  main { max-width:980px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:15px; margin:0 0 10px; }
  .lead { color:var(--sub); margin:0 0 18px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:14px; }
  .step { display:inline-block; background:var(--accent); color:#fff; border-radius:50%; width:22px; height:22px; text-align:center; line-height:22px; font-size:13px; margin-right:6px; }
  #drop { border:2px dashed var(--line); border-radius:8px; padding:26px 12px; text-align:center; color:var(--sub); cursor:pointer; }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  button, select, input[type=text], input[type=number] { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:5px 9px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; padding:9px 18px; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  table { border-collapse:collapse; width:100%; }
  th, td { border-bottom:1px solid var(--line); padding:5px 6px; text-align:left; vertical-align:middle; }
  th { font-size:13px; color:var(--sub); font-weight:600; }
  td input[type=text] { width:100%; min-width:80px; }
  .scroll { overflow-x:auto; }
  .preview td, .preview th { white-space:nowrap; font-size:13px; }
  .msg { margin:8px 0 0; font-size:14px; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .err { color:var(--err); }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .mini { padding:2px 8px; }
  .hint { color:var(--sub); font-size:13px; }
  label.opt { margin-right:14px; white-space:nowrap; }
</style>
</head>
<body>
<main>
  <h1>CSVヘッダー変換ツール</h1>
  <p class="lead">ネットショップなどからダウンロードしたCSVの列名を付け替え、不要な列の削除や固定値・連番の列の追加をして、別のシステムに取り込める形に変換します。
    データはこのブラウザの中だけで処理し、外部には送信しません。</p>

  <section>
    <h2><span class="step">1</span>変換前のCSVを選ぶ</h2>
    <div id="drop">ここにCSVファイルをドラッグ、またはクリックして選択</div>
    <input id="file" type="file" accept=".csv,text/csv" hidden>
    <p id="inInfo" class="msg hint"></p>
  </section>

  <section>
    <h2><span class="step">2</span>出力する列を決める</h2>
    <p class="hint">上から順に、出力CSVの左から並びます。「元の列」は変換前CSVの列名から選びます。</p>
    <div class="scroll"><table id="rules"><thead><tr>
      <th>出力する列名</th><th>中身</th><th>設定</th><th></th>
    </tr></thead><tbody></tbody></table></div>
    <div class="row" style="margin-top:10px">
      <button id="addCol">＋ 列を追加</button>
      <button id="loadSample">サンプルの設定を読み込む</button>
      <button id="saveRules">設定を保存（JSON）</button>
      <button id="loadRules">設定を読み込む</button>
      <input id="rulesFile" type="file" accept=".json,application/json" hidden>
    </div>
  </section>

  <section>
    <h2><span class="step">3</span>変換して保存</h2>
    <div class="row">
      <label class="opt">文字コード
        <select id="enc"><option value="sjis">Shift-JIS（Excel・業務ソフト向け）</option><option value="utf8">UTF-8（BOM付き）</option></select>
      </label>
      <label class="opt"><input type="checkbox" id="quoteAll"> すべての値を「"」で囲む</label>
      <button id="run" class="primary" disabled>変換する</button>
      <button id="download" disabled>CSVをダウンロード</button>
    </div>
    <div id="msgs"></div>
    <div class="scroll" style="margin-top:10px"><table id="preview" class="preview"></table></div>
    <p id="previewNote" class="hint"></p>
  </section>
</main>

<script src="core.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const TYPES = { source: '元の列', join: '複数の列をつなぐ', fixed: '固定値', seq: '連番', blank: '空欄' };
  let inputRows = null, inputName = '', inHeader = [], result = null;
  let rules = { columns: [] };

  // ---- 入力 ----
  function loadFile(f) {
    const reader = new FileReader();
    reader.onload = () => {
      const { text, encoding } = CsvConv.decodeBytes(new Uint8Array(reader.result));
      inputRows = CsvConv.parseCSV(text);
      inputName = f.name;
      inHeader = (inputRows[0] || []).map((h) => h.trim());
      $('inInfo').textContent = f.name + '：' + Math.max(inputRows.length - 1, 0) + '行・' + inHeader.length + '列（' + (encoding === 'utf-8' ? 'UTF-8' : 'Shift-JIS') + 'として読み込み）';
      $('run').disabled = false;
      result = null; $('download').disabled = true; $('preview').innerHTML = ''; $('msgs').innerHTML = ''; $('previewNote').textContent = '';
      renderRules();
    };
    reader.readAsArrayBuffer(f);
  }
  $('drop').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', (e) => { if (e.target.files[0]) loadFile(e.target.files[0]); });
  ['dragenter', 'dragover'].forEach((t) => $('drop').addEventListener(t, (e) => { e.preventDefault(); $('drop').classList.add('over'); }));
  ['dragleave', 'drop'].forEach((t) => $('drop').addEventListener(t, (e) => { e.preventDefault(); $('drop').classList.remove('over'); }));
  $('drop').addEventListener('drop', (e) => { if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

  // ---- ルール編集 ----
  function colSelect(value, onChange) {
    const s = document.createElement('select');
    const opts = inHeader.slice();
    if (value && !opts.includes(value)) opts.unshift(value);
    s.innerHTML = '<option value="">（選択）</option>' + opts.map((h) => '<option>' + esc(h) + '</option>').join('');
    s.value = value || '';
    if (value && !inHeader.includes(value) && inHeader.length) s.style.borderColor = 'var(--warn)';
    s.addEventListener('change', () => onChange(s.value));
    return s;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function textInput(value, ph, onChange, w) {
    const i = document.createElement('input'); i.type = 'text'; i.value = value == null ? '' : value; i.placeholder = ph || '';
    if (w) i.style.width = w;
    i.addEventListener('input', () => onChange(i.value)); return i;
  }
  function numInput(value, ph, onChange) {
    const i = document.createElement('input'); i.type = 'number'; i.min = 0; i.value = value == null ? '' : value; i.placeholder = ph; i.style.width = '70px';
    i.addEventListener('input', () => onChange(i.value === '' ? undefined : Number(i.value))); return i;
  }
  function label(t) { const s = document.createElement('span'); s.className = 'hint'; s.textContent = t + ' '; return s; }

  function settingCell(c) {
    const d = document.createElement('div'); d.className = 'row';
    if (c.type === 'source') d.append(colSelect(c.from, (v) => { c.from = v; }));
    else if (c.type === 'fixed') d.append(textInput(c.value, '例: 1', (v) => { c.value = v; }));
    else if (c.type === 'join') {
      d.append(textInput((c.from || []).join(','), '列名をカンマ区切り', (v) => { c.from = v.split(',').map((x) => x.trim()).filter(Boolean); }, '220px'));
      d.append(label('区切り'), textInput(c.sep || '', '（なし）', (v) => { c.sep = v; }, '70px'));
    } else if (c.type === 'seq') {
      d.append(label('開始'), numInput(c.start, '1', (v) => { c.start = v; }));
      d.append(label('桁数'), numInput(c.pad, '4', (v) => { c.pad = v; }));
      d.append(label('注文ごとに数え直す列'), colSelect(c.groupBy, (v) => { c.groupBy = v || undefined; }));
    } else d.textContent = '—';
    return d;
  }

  function renderRules() {
    const tb = $('rules').tBodies[0]; tb.innerHTML = '';
    rules.columns.forEach((c, i) => {
      const tr = document.createElement('tr');
      const tdName = document.createElement('td'); tdName.append(textInput(c.name, '列名', (v) => { c.name = v; }));
      const tdType = document.createElement('td');
      const sel = document.createElement('select');
      sel.innerHTML = Object.entries(TYPES).map(([k, v]) => '<option value="' + k + '">' + v + '</option>').join('');
      sel.value = c.type;
      sel.addEventListener('change', () => { c.type = sel.value; renderRules(); });
      tdType.append(sel);
      const tdSet = document.createElement('td'); tdSet.append(settingCell(c));
      const tdOps = document.createElement('td'); tdOps.style.whiteSpace = 'nowrap';
      [['↑', () => move(i, -1)], ['↓', () => move(i, 1)], ['削除', () => { rules.columns.splice(i, 1); renderRules(); }]].forEach(([t, fn]) => {
        const b = document.createElement('button'); b.className = 'mini'; b.textContent = t; b.addEventListener('click', fn); tdOps.append(b, ' ');
      });
      tr.append(tdName, tdType, tdSet, tdOps); tb.append(tr);
    });
  }
  function move(i, d) {
    const j = i + d; if (j < 0 || j >= rules.columns.length) return;
    [rules.columns[i], rules.columns[j]] = [rules.columns[j], rules.columns[i]]; renderRules();
  }
  $('addCol').addEventListener('click', () => { rules.columns.push({ name: '', type: 'source' }); renderRules(); });

  function setRules(r) { rules = CsvConv.validateRules(r); renderRules(); }
  $('loadSample').addEventListener('click', () => {
    fetch('examples/sample-rules.json').then((r) => r.json()).then(setRules).catch(() => msg('サンプル設定を読み込めませんでした（ファイルを直接開いた場合は「設定を読み込む」から examples/sample-rules.json を選んでください）', 'err'));
  });
  $('saveRules').addEventListener('click', () => save(new Blob([JSON.stringify(rules, null, 2)], { type: 'application/json' }), 'rules.json'));
  $('loadRules').addEventListener('click', () => $('rulesFile').click());
  $('rulesFile').addEventListener('change', (e) => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then((t) => { try { setRules(JSON.parse(t)); msg('設定を読み込みました', 'ok'); } catch (err) { msg('設定ファイルを読めません: ' + err.message, 'err'); } });
    e.target.value = '';
  });

  // ---- 変換・保存 ----
  function msg(t, cls) { $('msgs').innerHTML = '<p class="msg ' + cls + '">' + esc(t) + '</p>'; }
  function msgs(list) { $('msgs').innerHTML = list.map(([t, c]) => '<p class="msg ' + c + '">' + esc(t) + '</p>').join(''); }

  $('run').addEventListener('click', () => {
    try {
      if (!rules.columns.length) return msg('出力する列がありません。手順2で列を追加してください', 'err');
      CsvConv.validateRules(rules);
      result = CsvConv.convert(inputRows, rules);
    } catch (e) { return msg(e.message, 'err'); }
    const list = [['変換しました：' + result.rows.length + '行・' + result.header.length + '列', 'ok']];
    result.warnings.forEach((w) => list.push([w, 'warn']));
    msgs(list);
    const t = $('preview');
    t.innerHTML = '<thead><tr>' + result.header.map((h) => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
      result.rows.slice(0, 20).map((r) => '<tr>' + r.map((v) => '<td>' + esc(v) + '</td>').join('') + '</tr>').join('') + '</tbody>';
    $('previewNote').textContent = result.rows.length > 20 ? '先頭20行を表示しています（ダウンロードには全行が入ります）' : '';
    $('download').disabled = false;
  });

  $('download').addEventListener('click', () => {
    if (!result) return;
    const text = CsvConv.toCSV([result.header].concat(result.rows), { quoteAll: $('quoteAll').checked });
    const base = inputName.replace(/\.csv$/i, '') || 'output';
    if ($('enc').value === 'sjis') {
      const { bytes, unmappable } = CsvConv.encodeShiftJIS(text);
      if (unmappable.length) msgs([['変換しました', 'ok'], ['Shift-JISで表せない文字を「?」にしました：' + unmappable.join(' ') + '（UTF-8で保存すると残ります）', 'warn']]);
      save(new Blob([bytes], { type: 'text/csv' }), base + '_変換後.csv');
    } else save(new Blob(['﻿', text], { type: 'text/csv;charset=utf-8' }), base + '_変換後.csv');
  });
  function save(blob, name) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  renderRules();
})();
</script>
</body>
</html>
